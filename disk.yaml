object: CaveLog
id: 1
duration-mins: 210
area: Near Lisdoonvarna, Clare
note: Went along a fence until we reached a gate. We the wall on the right for a time. I was instructed to figure out the cave's location by Ronan, so I got the ITM coordinated from the survey and converted them so I could use them in OSM. Using this we navigated to the entrance of Faunarooska. The climb down was fairly nice. We then traversed through winding corridors for about 90 minutes, then the beginner caver was escorted back out. A group of 4 of us continued on for about half an hour. We found a frog and rescued it. We left the cave with no issues.
date: 28/02/2026
owner-id: 1
cave-name: Faunarooska
